# Run our tests against a specific version of astrocyte
before_script:
  - module load astrocyte/2.2.0



stages:
    - deploy

pages:
  stage: deploy
  before_script: []
  script:
  - mkdir -p public
  - cp custom-profile-builder.html public/index.html
  artifacts:
    paths:
    - public
  rules:
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
