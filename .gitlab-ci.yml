# Run our tests against a specific version of astrocyte
before_script:
  - module load astrocyte/2.2.0
  - module load openjdk/17.0.11_9
  - module load nextflow/23.04.3



stages:
    - check

# This performs validation of the astrocyte_pkg.yml file
astrocyte_check:
  stage: check
  script:
  - export MODULEPATH=/project/apps/apps_rhel9/modulefiles:/project/apps/apps_rhel9/spack/share/spack/modules/linux-rhel9-x86_64:/project/apps/apps_rhel9/spack/share/spack/modules/linux-rhel9-x86_64_v2
  - astrocyte_cli check "$CI_PROJECT_DIR"
