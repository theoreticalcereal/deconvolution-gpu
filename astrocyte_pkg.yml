name: '3d_deconvolution_gpu'
author: 'Ricky Wang'
email: 'ricky.wang@utsouthwestern.edu'
title: '3D GPU Deconvolution Workflow'
description: |
  This workflow normalizes selected microscopy image volumes to OME-Zarr,
  estimates a blind PSF, and runs GPU-accelerated Richardson-Lucy
  deconvolution. Use the separate deskew-gpu package to deskew ctASLM data
  before running this workflow.

citation: |
  Please acknowledge our contribution:
  This research was supported in part by the computational resources provided by
  the BioHPC supercomputing facility located in the Lyda Hill Department of
  Bioinformatics, UT Southwestern Medical Center.

minimum_astrocyte_version: '2.1.0'
nextflow_version: '24.10.0'
nextflow_config: 'biohpc.config'
container: 'singularity'
singularity_version: '3.9.9'

documentation_files:
  - [ 'index.md', '3D GPU Deconvolution Help' ]
  - [ 'workflow-overview.md', 'Workflow Overview' ]
  - [ 'psf-estimation-process.md', 'PSF Estimation Process' ]
  - [ 'gpu-deconvolution-process.md', 'GPU Deconvolution Process' ]
  - [ 'profiles-and-parameters.md', 'Profiles and Parameters' ]
  - [ 'workflow-output.md', 'workflow/output - Output from the Workflow' ]
  - [ 'outputs-and-troubleshooting.md', 'Outputs and Troubleshooting' ]
  - [ 'astrocyte-project-setup.md', 'Creating an Astrocyte Project' ]

workflow_modules:
  - 'singularity/3.9.9'
  - 'matlab/2024a'

workflow_containers:
  - docker://git.biohpc.swmed.edu:5050/dean-lab/ctaslm2-deconvolution:0.1.2

workflow_parameters:
  - id: input
    type: files
    required: true
    min: 1
    description: |
      Select deskewed or otherwise ready-to-deconvolve image volumes.
    regex: ".*(\\.tif|\\.tiff|\\.czi|\\.nd2|\\.lif|\\.h5|\\.hdf5|\\.ome\\.zarr|\\.ozx|\\.TIF|\\.TIFF|\\.CZI|\\.ND2|\\.LIF|\\.H5|\\.HDF5|\\.OME\\.ZARR|\\.OZX)$"

  - id: microscope_profile
    type: select
    required: true
    default: 'auto'
    description: |
      Select the complete microscope, magnification, and refractive-index
      profile. Choose automatic inference only when uploading a supported
      Navigate acquisition YAML.
    choices:
      - [ 'auto', 'Infer from optional acquisition YAML' ]
      - [ 'upright_aslm_36x_ri_1_33', 'Upright ASLM — 36x — RI 1.33' ]
      - [ 'benchtop_mesospim_4x_ri_1_56', 'BenchTop MesoSPIM — 4x — RI 1.56' ]
      - [ 'benchtop_mesospim_10x_ri_1_56', 'BenchTop MesoSPIM — 10x — RI 1.56' ]
      - [ 'benchtop_mesospim_10x_ri_1_52', 'BenchTop MesoSPIM — 10x — RI 1.52' ]
      - [ 'ctaslm_v3_50x_ri_1_56', 'ctASLM v3 — 50x — RI 1.56' ]
      - [ 'ctaslm_v3_50x_ri_1_52', 'ctASLM v3 — 50x — RI 1.52' ]
      - [ 'multiscale_low_res_0_63x_ri_1_56', 'Multiscale - Low Res — 0.63x — RI 1.56' ]
      - [ 'multiscale_low_res_1x_ri_1_56', 'Multiscale - Low Res — 1x — RI 1.56' ]
      - [ 'multiscale_low_res_2x_ri_1_56', 'Multiscale - Low Res — 2x — RI 1.56' ]
      - [ 'multiscale_low_res_3x_ri_1_56', 'Multiscale - Low Res — 3x — RI 1.56' ]
      - [ 'multiscale_low_res_4x_ri_1_56', 'Multiscale - Low Res — 4x — RI 1.56' ]
      - [ 'multiscale_low_res_5x_ri_1_56', 'Multiscale - Low Res — 5x — RI 1.56' ]
      - [ 'multiscale_low_res_6x_ri_1_56', 'Multiscale - Low Res — 6x — RI 1.56' ]
      - [ 'multiscale_high_res_38x_ri_1_56', 'Multiscale - High Res — 38x — RI 1.56' ]
      - [ 'multiscale_high_res_37x_ri_1_52', 'Multiscale - High Res — 37x — RI 1.52' ]
      - [ 'custom', 'Custom — provide deconvolution parameters YAML' ]

  - id: config_file
    type: files
    required: false
    min: 1
    max: 1
    description: |
      Optional Navigate acquisition YAML, used to infer the microscope profile,
      wavelength, and Z spacing when those are not selected or entered below.
      With the Custom profile, provide the previous flat deconvolution
      parameters YAML instead.
    regex: ".*(\\.yml|\\.yaml|\\.YML|\\.YAML)$"

  - id: wavelength
    type: real
    required: false
    min: 0.001
    description: |
      Optional emission wavelength in µm. It is inferred from the selected
      channel when a Navigate acquisition YAML is uploaded.

  - id: dz
    type: real
    required: false
    min: 0.001
    description: |
      Optional axial Z spacing in µm. It is inferred from the absolute
      MicroscopeState.step_size when a Navigate acquisition YAML is uploaded.

  - id: image_aggressiveness
    type: select
    required: true
    default: 'medium'
    description: |
      Select the speed/accuracy preset. Processing engines and queue placement
      are fixed by this choice.
    choices:
      - [ 'low', 'Low — fastest GPU processing' ]
      - [ 'medium', 'Medium — balanced GPU processing' ]
      - [ 'high', 'High — maximum-accuracy CPU processing' ]

  - id: output_selection
    type: select
    required: true
    default: 'ozx_1x'
    description: |
      Select the maximum OME-Zarr XY pyramid level, or TIFF for a single-level
      TIFF output.
    choices:
      - [ 'ozx_1x', '1x' ]
      - [ 'ozx_2x', '2x' ]
      - [ 'ozx_4x', '4x' ]
      - [ 'ozx_8x', '8x' ]
      - [ 'ozx_16x', '16x' ]
      - [ 'tiff', 'TIFF (1x)' ]
