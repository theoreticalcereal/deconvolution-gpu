name: '3d_deconvolution_gpu'
author: 'Ricky Wang'
email: 'ricky.wang@utsouthwestern.edu'
title: '3D GPU Deconvolution Workflow'
description: |
  This workflow normalizes selected microscopy image volumes to OME-Zarr,
  estimates a blind PSF, and runs GPU-accelerated Richardson-Lucy
  deconvolution. Use the separate deskew-gpu package to deskew ctASLM data
  before running this workflow.

citation: |
  Please acknowledge our contribution:
  This research was supported in part by the computational resources provided by
  the BioHPC supercomputing facility located in the Lyda Hill Department of
  Bioinformatics, UT Southwestern Medical Center.

minimum_astrocyte_version: '2.1.0'
nextflow_version: '24.10.0'
nextflow_config: 'biohpc.config'
container: 'singularity'
singularity_version: '3.9.9'

documentation_files:
  - [ 'index.md', '3D GPU Deconvolution Help' ]
  - [ 'workflow-overview.md', 'Workflow Overview' ]
  - [ 'psf-estimation-process.md', 'PSF Estimation Process' ]
  - [ 'gpu-deconvolution-process.md', 'GPU Deconvolution Process' ]
  - [ 'profiles-and-parameters.md', 'Profiles and Parameters' ]
  - [ 'workflow-output.md', 'workflow/output - Output from the Workflow' ]
  - [ 'outputs-and-troubleshooting.md', 'Outputs and Troubleshooting' ]

workflow_modules:
  - 'lmod/8.4'
  - 'matlab/2024a'
  - 'anaconda3/2023.09-0'

workflow_parameters:
  - id: input
    type: files
    required: true
    min: 1
    description: |
      Select deskewed or otherwise ready-to-deconvolve image volumes.
    regex: ".*(\\.tif|\\.tiff|\\.czi|\\.nd2|\\.lif|\\.h5|\\.hdf5|\\.ome\\.zarr|\\.TIF|\\.TIFF|\\.CZI|\\.ND2|\\.LIF|\\.H5|\\.HDF5|\\.OME\\.ZARR)$"

  - id: output_formats
    type: select
    required: false
    default: 'ome_zarr'
    description: |
      Final image output format to publish. OME-Zarr is the native workflow
      output. Choose TIFF to also export final deconvolved volumes as TIFF stacks.
    choices:
      - [ 'ome_zarr', 'OME-Zarr output' ]
      - [ 'tiff', 'TIFF stack export' ]

  - id: decon_runtime_dir
    type: string
    required: false
    default: '-1'
    description: |
      Optional existing runtime directory to reuse instead of building a new
      conda environment. This can point to a deconvolution runtime, a deskew
      runtime, or directly to the conda environment directory. Use -1 to build
      the default deconvolution runtime.

  - id: iter
    type: integer
    required: false
    default: 20
    min: 1
    description: Richardson-Lucy iteration count for CUDA deconvolution.

  - id: background
    type: real
    required: false
    default: 0
    description: Constant background subtraction value.

  - id: psf_mode
    type: select
    required: false
    default: 'single'
    description: Seed PSF mode used before blind PSF estimation.
    choices:
      - [ 'single', 'Single detection PSF' ]
      - [ 'light_sheet', 'Detection PSF times rotated illumination PSF' ]

  - id: psf_model
    type: select
    required: false
    default: 'vectorial'
    description: Theoretical PSF model used as the blind-estimation seed.
    choices:
      - [ 'vectorial', 'Vectorial Gibson-Lanni model' ]
      - [ 'scalar', 'Scalar Gibson-Lanni model' ]
      - [ 'gaussian', 'Gaussian approximation' ]

  - id: wavelength
    type: real
    required: true
    min: 0
    description: Emission wavelength in microns.

  - id: na
    type: real
    required: true
    min: 0
    description: Backward-compatible detection numerical aperture.

  - id: detection_na
    type: real
    required: false
    default: -1
    min: -1
    description: Detection objective numerical aperture; -1 falls back to Backward-compatible numerical aperture.

  - id: illumination_na
    type: real
    required: false
    default: -1
    min: -1
    description: Illumination objective numerical aperture for light-sheet PSF metadata; -1 falls back to Backward-compatible numerical aperture.

  - id: ni
    type: real
    required: true 
    min: -1
    description: Immersion refractive index for PSF generation.

  - id: ns
    type: real
    required: true
    default: -1
    min: -1
    description: Specimen/sample refractive index; -1 falls back to immersion refractive index.

  - id: dxy
    type: real
    required: false
    default: -1
    min: -1
    description: Final sample pixel size in X/Y, in microns.

  - id: dz
    type: real
    required: true
    min: 0
    description: Sample pixel size in Z, in microns.

  - id: camera_pixel_size
    type: real
    required: false
    default: -1
    min: -1
    description: Camera pixel size in microns; with magnification this can derive dxy.

  - id: magnification
    type: real
    required: false
    default: -1
    min: -1
    description: Objective/tube magnification; with camera_pixel_size this can derive dxy.

  - id: light_sheet_angle
    type: real
    required: false
    default: 90
    description: Illumination PSF rotation angle for light-sheet PSF mode.

  - id: blind_iters
    type: integer
    required: false
    default: 20
    min: 1
    description: MATLAB deconvblind iteration count per blind PSF chunk.

  - id: chunk_xy
    type: integer
    required: false
    default: 256
    description: XY tile size for blind PSF estimation; values <= 0 auto-size.

  - id: decon_chunk_xy
    type: integer
    required: false
    default: 0
    description: Core XY tile size for CUDA deconvolution; values <= 0 auto-size.

  - id: decon_workers
    type: integer
    required: false
    default: 1
    min: 1
    description: Parallel CUDA deconvolution workers per process. Recommend 1, safe limit at 2 until multi-GPU nodes are called. 

  - id: vram_gb
    type: real
    required: false
    default: -1
    min: -1
    description: Optional manual GPU memory budget in GB; -1 automatically sizes chunks. 
